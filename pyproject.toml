[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-optimization-gurobi"
version = "0.1.0"
description = "Modelos de optimización de carteras formulados en Python con Gurobi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gurobipy>=12.0"]

[project.scripts]
portfolio-optimization = "portfolio_optimization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
